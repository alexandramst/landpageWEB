<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página em Construção 🚧</title>
</head>
<body>
    <style>

    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    }

    html, body {
    height: 100%;
    width: 100%;
    font-family: 'Jura', sans-serif;
    background-color: rgb(30, 30, 30);
    color: rgb(255, 255, 255);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    }

    
    .construcao-container {
    padding: 40px;
    }

    .construcao-container h1 {
    font-size: 36px;
    margin-bottom: 20px;
    letter-spacing: 1px;
    }

    .construcao-container p {
    font-size: 20px;
    color: rgb(200, 200, 200);
    line-height: 1.6;
    }

    /* Botão Voltar */
    .btn-voltar {
    font-family: 'Jura', sans-serif;
    font-size: 18px;
    padding: 12px 30px;
    background-color: transparent;
    border: 2px solid rgb(255, 255, 255);
    color: rgb(255, 255, 255);
    text-decoration: none;
    border-radius: 50px;
    transition: all 0.3s ease;
    }

    .btn-voltar:hover {
    background-color: rgb(255, 255, 255);
    color: rgb(30, 30, 30);
    }

    /* Responsivo */
    @media (max-width: 576px) {
    .construcao-container h1 {
        font-size: 28px;
    }

    .construcao-container p {
        font-size: 16px;
    }

    .btn-voltar {
        font-size: 16px;
        padding: 10px 25px;
    }
    }


    </style>


    <div class="construcao-container">
        <h1>Estamos a construir algo incrível para ti!</h1>
        <p>Esta página está atualmente em construção.<br>Voltaremos em breve!<br>🚧</p>
        <br>
        <br>
        <a href="../index.html" class="btn-voltar">Voltar ao Início</a>
    </div>
    
</body>
</html>
