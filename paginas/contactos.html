<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contactos - Living Around</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Fontes -->
  <link href="https://fonts.googleapis.com/css2?family=Jura:wght@300;400;700&family=Josefin+Slab:wght@400;700&display=swap" rel="stylesheet">

  <!-- CSS personalizado -->
  <link rel="stylesheet" href="../css/stylesContactos.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="../index.html">
      <img src="../imagens/logo-grey.png" alt="Living Around" width="50">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="../paginas/acomodacao.html">ACOMODAÇÃO</a></li>
        <li class="nav-item"><a class="nav-link" href="../paginas/explorar.html">LOCAIS</a></li>
        <li class="nav-item"><a class="nav-link" href="../paginas/paginaEmConstrucao.html">BLOG</a></li>
        <li class="nav-item"><a class="nav-link" href="#">CONTACTOS</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Seção de Contactos -->
<section class="secao-contactos">
    <div class="overlay"></div>
  
    <div class="container-contactos">
      
      <!-- Div esquerda: Formulário -->
      <div class="div-formulario d-flex justify-content-center align-items-center">
        <div class="formulario p-4 rounded">
          <form id="form-contactos">
            <div class="mb-3">
              <label for="nome" class="form-label">Nome:</label>
              <input type="text" class="form-control" id="nome" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email:</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
              <label for="mensagem" class="form-label">Mensagem:</label>
              <textarea class="form-control" id="mensagem" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn-enviar mt-3">Enviar</button>
          </form>
        </div>
      </div>
  
      <!-- Div direita: Frase -->
      <div class="div-frase d-flex align-items-start justify-content-end">
        <div class="frase-contactos text-end">
          <p class="frase">"Viajar é descobrir que todos estão errados sobre outros países."</p>
          <p class="autor">- Aldous Huxley</p>
        </div>
      </div>
  
    </div>
  </section>

<!-- Modal de Sucesso -->
<div class="modal fade" id="sucessoModal" tabindex="-1" aria-labelledby="sucessoModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-top-centered">
    <div class="modal-content text-center p-4">
      <div class="modal-body">
        <p class="mb-4">Seu formulário foi enviado com sucesso!</p>
        <button type="button" class="btn-ok" data-bs-dismiss="modal">Ok</button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS personalizado -->
<script src="../js/scriptContactos.js"></script>

</body>
</html>
